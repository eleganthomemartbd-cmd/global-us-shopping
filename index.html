<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Global US Shopping</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f6f8;
color:#111827
}

button{cursor:pointer}

.header{
background:#111827;
color:white;
padding:14px;
position:sticky;
top:0;
z-index:50
}

.nav{
max-width:1150px;
margin:auto;
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap
}

.logo{
font-size:20px;
font-weight:bold;
white-space:nowrap
}

.logo span{color:#fbbf24}

.search{
flex:1;
display:flex;
min-width:180px
}

.search input{
width:100%;
padding:12px;
border:0;
outline:0;
border-radius:8px 0 0 8px
}

.search button{
border:0;
padding:0 15px;
background:#fbbf24;
border-radius:0 8px 8px 0
}

.navbtn{
background:#1f2937;
border:1px solid #374151;
color:white;
padding:10px 12px;
border-radius:8px
}

.hero{
background:linear-gradient(135deg,#111827,#1d4ed8);
color:white;
padding:50px 20px
}

.hero-inner{
max-width:1150px;
margin:auto
}

.hero h1{
font-size:40px;
margin-bottom:10px
}

.hero p{
color:#dbeafe;
margin-bottom:20px;
font-size:17px
}

.shop{
border:0;
padding:13px 22px;
border-radius:8px;
background:#fbbf24;
font-weight:bold
}

.container{
max-width:1150px;
margin:auto;
padding:28px 18px
}

.title{
font-size:25px;
margin-bottom:18px
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:17px
}

.product{
background:white;
border-radius:13px;
overflow:hidden;
box-shadow:0 3px 15px #00000012
}

.pic{
height:175px;
background:#eef2ff;
display:flex;
justify-content:center;
align-items:center;
font-size:70px
}

.info{
padding:14px
}

.info h3{
font-size:16px;
margin-bottom:8px
}

.info p{
font-size:12px;
color:#6b7280;
margin-bottom:10px
}

.price{
font-size:20px;
font-weight:bold;
margin-bottom:12px
}

.actions{
display:flex;
gap:7px
}

.actions button{
flex:1;
padding:10px 5px;
border:0;
border-radius:7px;
font-weight:bold
}

.add{
background:#e5e7eb
}

.buy{
background:#fbbf24
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:100;
align-items:center;
justify-content:center;
padding:18px
}

.box{
width:100%;
max-width:430px;
background:white;
border-radius:15px;
padding:25px;
position:relative
}

.close{
position:absolute;
right:16px;
top:10px;
font-size:25px;
cursor:pointer
}

.box h2{
margin-bottom:18px
}

.input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:8px;
margin-bottom:10px;
outline:none
}

.mainbtn{
width:100%;
padding:12px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:bold
}

.switch{
text-align:center;
color:#2563eb;
font-size:13px;
margin-top:13px;
cursor:pointer
}

.message{
text-align:center;
font-size:12px;
margin-top:10px;
color:#dc2626
}

.cart-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px 0;
border-bottom:1px solid #e5e7eb
}

.remove{
border:0;
background:#ef4444;
color:white;
padding:7px 9px;
border-radius:6px
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:17px
}

.checkout{
width:100%;
padding:13px;
border:0;
border-radius:8px;
background:#16a34a;
color:white;
font-weight:bold;
margin-top:12px
}

.empty{
text-align:center;
padding:25px;
color:#6b7280
}

footer{
background:#111827;
color:#9ca3af;
text-align:center;
padding:30px 15px;
margin-top:30px
}

.creator{
color:#fbbf24;
font-weight:bold;
margin-top:7px
}

@media(max-width:900px){
.products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
.products{grid-template-columns:repeat(2,1fr);gap:10px}

.logo{
width:100%;
text-align:center
}

.search{
order:2;
width:100%
}

.hero h1{font-size:30px}

.pic{
height:135px;
font-size:52px
}

.info{
padding:10px
}

.info h3{
font-size:14px
}

.actions{
flex-direction:column
}
}
</style>
</head>

<body>

<header class="header">

<div class="nav">

<div class="logo">
GLOBAL <span>US</span> SHOPPING
</div>

<div class="search">

<input
id="search"
placeholder="Search products..."
>

<button onclick="searchProducts()">🔍</button>

</div>

<button
class="navbtn"
onclick="openLogin()">
👤 Account
</button>

<button
class="navbtn"
onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<div class="hero-inner">

<h1>Global US Shopping</h1>

<p>
Shop smart. Discover amazing products.
</p>

<button
class="shop"
onclick="document.getElementById('products').scrollIntoView()">
Shop Now 🛍️
</button>

</div>

</section>


<main class="container">

<h2 class="title" id="products">
🔥 Popular Products
</h2>

<div
class="products"
id="productGrid">
</div>

</main>


<!-- LOGIN -->

<div
class="modal"
id="loginModal">

<div class="box">

<div
class="close"
onclick="closeLogin()">
×
</div>

<h2 id="authTitle">
Login
</h2>

<input
class="input"
id="name"
placeholder="Full Name"
style="display:none"
>

<input
class="input"
id="email"
type="email"
placeholder="Email"
>

<input
class="input"
id="password"
type="password"
placeholder="Password"
>

<button
class="mainbtn"
id="authButton"
onclick="handleAuth()">
Login
</button>

<div
class="switch"
id="switchAuth"
onclick="switchAuth()">
Create New Account
</div>

<div
class="message"
id="message">
</div>

</div>

</div>


<!-- CART -->

<div
class="modal"
id="cartModal">

<div class="box">

<div
class="close"
onclick="closeCart()">
×
</div>

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<div
class="total"
id="cartTotal">
Total: $0.00
</div>

<button
class="checkout"
onclick="checkout()">
⚡ Buy Now / Checkout
</button>

</div>

</div>


<footer>

<div>
🌎 Global US Shopping
</div>

<div class="creator">
Created by Atik ❤️
</div>

</footer>


<script type="module">

import{
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import{
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyCkmcBOiv4hTDINvTFT7d2ZEr2nQK9jShw",

authDomain:
"global-usa-products.firebaseapp.com",

projectId:
"global-usa-products",

storageBucket:
"global-usa-products.firebasestorage.app",

messagingSenderId:
"695981349295",

appId:
"1:695981349295:web:399cfb381b500c58c0b75a",

measurementId:
"G-L89GW4FTM8"

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);


/* PRODUCTS */

const products=[

{
id:1,
name:"Premium Wireless Headphones",
price:49.99,
icon:"🎧"
},

{
id:2,
name:"Smart Watch",
price:39.99,
icon:"⌚"
},

{
id:3,
name:"Bluetooth Speaker",
price:29.99,
icon:"🔊"
},

{
id:4,
name:"Gaming Mouse",
price:24.99,
icon:"🖱️"
},

{
id:5,
name:"USB-C Fast Charger",
price:19.99,
icon:"🔌"
},

{
id:6,
name:"LED Desk Lamp",
price:34.99,
icon:"💡"
},

{
id:7,
name:"Travel Backpack",
price:44.99,
icon:"🎒"
},

{
id:8,
name:"Wireless Keyboard",
price:32.99,
icon:"⌨️"
}

];


let cart=
JSON.parse(
localStorage.getItem("shoppingCart")||"[]"
);

let registerMode=false;


/* DISPLAY PRODUCTS */

function showProducts(list=products){

const grid=
document.getElementById("productGrid");

if(!list.length){

grid.innerHTML=
'<div class="empty">No products found.</div>';

return;

}

grid.innerHTML=
list.map(product=>`

<div class="product">

<div class="pic">
${product.icon}
</div>

<div class="info">

<h3>
${product.name}
</h3>

<p>
Quality product • Fast shipping
</p>

<div class="price">
$${product.price.toFixed(2)}
</div>

<div class="actions">

<button
class="add"
onclick="addToCart(${product.id})">
🛒 Add
</button>

<button
class="buy"
onclick="buyNow(${product.id})">
⚡ Buy
</button>

</div>

</div>

</div>

`).join("");

}


/* SEARCH */

window.searchProducts=()=>{

const q=
document
.getElementById("search")
.value
.toLowerCase();

showProducts(
products.filter(p=>
p.name.toLowerCase().includes(q)
)
);

};


/* CART */

window.addToCart=(id)=>{

const product=
products.find(p=>p.id===id);

const existing=
cart.find(p=>p.id===id);

if(existing){

existing.qty++;

}else{

cart.push({
...product,
qty:1
});

}

saveCart();

alert("Added to cart 🛒");

};


function saveCart(){

localStorage.setItem(
"shoppingCart",
JSON.stringify(cart)
);

updateCount();

}


function updateCount(){

document
.getElementById("cartCount")
.textContent=
cart.reduce(
(a,p)=>a+p.qty,
0
);

}


window.openCart=()=>{

renderCart();

document
.getElementById("cartModal")
.style.display="flex";

};


window.closeCart=()=>{

document
.getElementById("cartModal")
.style.display="none";

};


function renderCart(){

const box=
document.getElementById("cartItems");

if(!cart.length){

box.innerHTML=
'<div class="empty">Your cart is empty 🛒</div>';

document
.getElementById("cartTotal")
.textContent=
"Total: $0.00";

return;

}

let total=0;

box.innerHTML=
cart.map(item=>{

total+=
item.price*item.qty;

return`

<div class="cart-item">

<div>
${item.icon}
<b>${item.name}</b>
<br>
$${item.price.toFixed(2)}
× ${item.qty}
</div>

<button
class="remove"
onclick="removeItem(${item.id})">
Remove
</button>

</div>

`;

}).join("");

document
.getElementById("cartTotal")
.textContent=
"Total: $"+
total.toFixed(2);

}


window.removeItem=(id)=>{

cart=
cart.filter(p=>p.id!==id);

saveCart();

renderCart();

};


/* BUY NOW */

window.buyNow=(id)=>{

const product=
products.find(p=>p.id===id);

if(!auth.currentUser){

alert(
"Please login before buying."
);

openLogin();

return;

}

alert(
"Buy Now selected:\n\n"+
product.name+
"\nPrice: $"+
product.price+
"\n\nReal checkout will be connected in the next version."
);

};


/* CHECKOUT */

window.checkout=()=>{

if(!cart.length){

alert("Your cart is empty.");

return;

}

if(!auth.currentUser){

alert(
"Please login before checkout."
);

closeCart();

openLogin();

return;

}

alert(
"Checkout system will be connected next."
);

};


/* LOGIN */

window.openLogin=()=>{

document
.getElementById("loginModal")
.style.display="flex";

};


window.closeLogin=()=>{

document
.getElementById("loginModal")
.style.display="none";

};


window.switchAuth=()=>{

registerMode=
!registerMode;

document
.getElementById("authTitle")
.textContent=
registerMode
?"Create Account"
:"Login";

document
.getElementById("authButton")
.textContent=
registerMode
?"Register"
:"Login";

document
.getElementById("name")
.style.display=
registerMode
?"block"
:"none";

document
.getElementById("switchAuth")
.textContent=
registerMode
?"Already have an account? Login"
:"Create New Account";

document
.getElementById("message")
.textContent="";

};


/* AUTH ACTION */

window.handleAuth=async()=>{

const email=
document
.getElementById("email")
.value
.trim();

const password=
document
.getElementById("password")
.value;

const msg=
document
.getElementById("message");


if(!email||!password){

msg.textContent=
"Email and password required.";

return;

}


try{

if(registerMode){

await createUserWithEmailAndPassword(
auth,
email,
password
);

msg.style.color="#16a34a";

msg.textContent=
"Account created successfully!";

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

closeLogin();

}

}catch(error){

msg.style.color="#dc2626";

if(error.code===
"auth/email-already-in-use"){

msg.textContent=
"Email already has an account.";

}else if(
error.code===
"auth/invalid-credential"
){

msg.textContent=
"Email or password is incorrect.";

}else{

msg.textContent=
"Something went wrong.";

}

}

};


/* AUTH STATE */

onAuthStateChanged(
auth,
user=>{

if(user){

document
.querySelector(".navbtn")
.textContent=
"👤 "+user.email.split("@")[0];

}else{

document
.querySelector(".navbtn")
.textContent=
"👤 Account";

}

});


/* LOGOUT */

window.logout=()=>{

signOut(auth);

};


showProducts();

updateCount();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Global US Shopping</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:white;padding:14px;position:sticky;top:0;z-index:10}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:bold}
.logo span{color:#38bdf8}
.search{flex:1;display:flex;min-width:180px}
.search input{width:100%;padding:12px;border:0;outline:0;border-radius:7px 0 0 7px}
.search button{padding:0 15px;border:0;background:#f59e0b;border-radius:0 7px 7px 0}
.nav button{padding:10px 12px;border:1px solid #374151;border-radius:7px;background:#1f2937;color:white}
.hero{background:linear-gradient(135deg,#0f172a,#1e40af);color:white;padding:55px 20px}
.hero div{max-width:1200px;margin:auto}
.hero h1{font-size:42px;margin-bottom:12px}
.hero p{font-size:18px;margin-bottom:20px;color:#dbeafe}
.hero button{padding:13px 22px;border:0;border-radius:8px;background:#f59e0b;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:30px 18px}
h2{margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001}
.pic{height:170px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:65px}
.info{padding:15px}
.info h3{margin-bottom:8px}
.price{font-size:20px;font-weight:bold;margin-bottom:12px}
.old{text-decoration:line-through;color:#999;font-size:13px}
.actions{display:flex;gap:7px}
.actions button{flex:1;padding:10px;border:0;border-radius:7px;font-weight:bold}
.cart{background:#e5e7eb}
.buy{background:#f59e0b}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;align-items:center;justify-content:center;padding:20px}
.box{background:white;width:100%;max-width:430px;border-radius:14px;padding:25px;position:relative}
.close{position:absolute;right:15px;top:10px;font-size:25px}
.box input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:7px}
.box>button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:7px;background:#2563eb;color:white;font-weight:bold}
.switch{text-align:center;color:#2563eb;margin-top:15px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}
.item button{background:#ef4444;color:white;border:0;padding:6px;border-radius:5px}
.total{text-align:right;font-size:20px;font-weight:bold;margin-top:15px}
footer{text-align:center;background:#111827;color:white;padding:30px;margin-top:30px}

@media(max-width:800px){
.products{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:30px}
}
@media(max-width:500px){
.products{gap:10px}
.pic{height:130px;font-size:50px}
.info{padding:10px}
.info h3{font-size:14px}
.actions{flex-direction:column}
.logo{width:100%;text-align:center}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">🌎 Global <span>US Shopping</span></div>

<div class="search">
<input id="search" placeholder="Search products..." oninput="searchProducts()">
<button>🔍</button>
</div>

<button onclick="openLogin()">👤 Login</button>
<button onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

</div>
</header>

<section class="hero">
<div>
<h1>Shop Globally. Shop Smart.</h1>
<p>Discover amazing products from around the world.</p>
<button onclick="document.getElementById('products').scrollIntoView()">Shop Now 🛍️</button>
</div>
</section>

<div class="container">

<h2 id="products">🔥 Popular Products</h2>

<div class="products" id="grid"></div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
<div class="box">
<div class="close" onclick="closeLogin()">×</div>
<h2 id="loginTitle">Login</h2>

<input id="name" placeholder="Full Name" style="display:none">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="switch" onclick="switchLogin()" id="switch">
Don't have an account? Register
</div>
</div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
<div class="box">
<div class="close" onclick="closeCart()">×</div>
<h2>🛒 Your Cart</h2>

<div id="items"></div>

<div class="total" id="total">Total: $0</div>

<button onclick="checkout()">⚡ Buy Now / Checkout</button>
</div>
</div>

<footer>
<h3>🌎 Global US Shopping</h3>
<p>Created by Atik ❤️</p>
</footer>

<script>

const products=[
{id:1,name:"iPhone",price:799,old:899,icon:"📱"},
{id:2,name:"Wireless Headphones",price:59,old:79,icon:"🎧"},
{id:3,name:"Smart Watch",price:89,old:119,icon:"⌚"},
{id:4,name:"Gaming Laptop",price:999,old:1199,icon:"💻"},
{id:5,name:"Digital Camera",price:499,old:599,icon:"📷"},
{id:6,name:"Sneakers",price:75,old:99,icon:"👟"},
{id:7,name:"Smart TV",price:399,old:499,icon:"📺"},
{id:8,name:"Travel Backpack",price:45,old:65,icon:"🎒"}
];

let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let register=false;

function render(list=products){
grid.innerHTML=list.map(p=>`
<div class="card">
<div class="pic">${p.icon}</div>
<div class="info">
<h3>${p.name}</h3>
<div class="price">$${p.price}
<span class="old">$${p.old}</span></div>
<div class="actions">
<button class="cart" onclick="add(${p.id})">🛒 Cart</button>
<button class="buy" onclick="buy(${p.id})">⚡ Buy Now</button>
</div>
</div>
</div>`).join("");
}

function searchProducts(){
let q=search.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(q)));
}

function add(id){
let p=products.find(x=>x.id===id);
let x=cart.find(x=>x.id===id);
x?x.qty++:cart.push({...p,qty:1});
save();
alert("Added to cart 🛒");
}

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
count.innerText=cart.reduce((a,b)=>a+b.qty,0);
}

function openCart(){
items.innerHTML=cart.length?cart.map(p=>`
<div class="item">
<span>${p.icon} ${p.name}<br>$${p.price} × ${p.qty}</span>
<button onclick="removeItem(${p.id})">Remove</button>
</div>`).join(""):"<p>Your cart is empty 🛒</p>";

let total=cart.reduce((a,b)=>a+b.price*b.qty,0);
document.getElementById("total").innerText="Total: $"+total;
cartModal.style.display="flex";
}

function removeItem(id){
cart=cart.filter(p=>p.id!==id);
save();
openCart();
}

function closeCart(){
cartModal.style.display="none";
}

function buy(id){
let p=products.find(x=>x.id===id);
alert("⚡ Buy Now\n\n"+p.name+"\nPrice: $"+p.price+
"\n\nReal checkout will be added next.");
}

function checkout(){
if(!cart.length)return alert("Your cart is empty 🛒");
alert("✅ Order system will be connected in the next version.");
}

function openLogin(){
loginModal.style.display="flex";
}

function closeLogin(){
loginModal.style.display="none";
}

function switchLogin(){
register=!register;
loginTitle.innerText=register?"Create Account":"Login";
name.style.display=register?"block":"none";
document.querySelector("#loginModal button").innerText=register?"Register":"Login";
switch.innerText=register?"Already have an account? Login":"Don't have an account? Register";
}

function login(){
if(!email.value||!password.value)return alert("Enter email and password.");
if(register&&!name.value)return alert("Enter your name.");
localStorage.setItem("user",email.value);
alert(register?"🎉 Account created!":"✅ Login successful!");
closeLogin();
}

render();
save();

</script>

</body>
</html>
